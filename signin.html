<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | Yaschi</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            margin: 0;
            background-color: #e2e8e4;
            font-family: Arial, Helvetica, sans-serif;
        }

        .signin-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signin-box {
            width: 350px;
            background-color: #fffaf8;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .signin-logo {
            width: 100px;
            height: 85px;
            margin: auto;
            background-image: url("Yaschi_logo.png");
            background-size: cover;
            background-position: center;
        }

        .signin-box h1 {
            color: #9fb7aa;
            font-family: Georgia, serif;
            margin: 15px 0 5px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-box {
            text-align: left;
            margin-bottom: 18px;
        }

        .input-box label {
            color: #666;
            font-size: 14px;
        }

        .input-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #d8b4b6;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .input-box input:focus {
            border: 2px solid #9fb7aa;
        }

        .password {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .forgot {
            color: #cfa7b5;
            font-size: 13px;
            text-decoration: none;
        }

        .signin-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background-color: #d8b4b6;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }

        .signin-button:hover {
            background-color: #9fb7aa;
        }

        .divider {
            margin: 25px 0;
            color: #aaa;
            font-size: 13px;
        }

        .create-button {
            width: 100%;
            padding: 11px;
            border: 1px solid #d8b4b6;
            border-radius: 25px;
            background-color: transparent;
            color: #cfa7b5;
            cursor: pointer;
            font-size: 15px;
        }

        .create-button:hover {
            background-color: #f5e9e9;
        }

        .back-home {
            display: block;
            margin-top: 20px;
            color: #9fb7aa;
            text-decoration: none;
            font-size: 14px;
        }

        .message {
            margin-top: 15px;
            color: #9fb7aa;
            font-size: 14px;
        }

    </style>

</head>

<body>

    <div class="signin-page">

        <div class="signin-box">

            <div class="signin-logo"></div>

            <h1>Welcome to Yaschi</h1>

            <p class="subtitle">
                Sign in to continue your cottagecore journey ♡
            </p>


            <form id="signinForm">

                <div class="input-box">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-box">

                    <div class="password">

                        <label>Password</label>

                        <a href="#" class="forgot">
                            Forgot password?
                        </a>

                    </div>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit" class="signin-button">

                    Sign In

                </button>

            </form>


            <p class="message" id="message"></p>


            <div class="divider">
                ─────── or ───────
            </div>


            <button class="create-button">

                Create New Account

            </button>


            <a href="index.html" class="back-home">

                ← Back to Yaschi

            </a>

        </div>

    </div>


    <script>

        let form = document.getElementById("signinForm");
        let createBtn = document.querySelector(".create-button");

        form.addEventListener("submit", function(event) {
            event.preventDefault();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;
            let message = document.getElementById("message");

            if (email === "" || password === "") {
                message.innerHTML = "Please fill all the fields.";
                message.style.color = "#d9534f";
            } else {
                let displayName = email.split("@")[0];
                displayName = displayName.charAt(0).toUpperCase() + displayName.slice(1);
                localStorage.setItem("yaschi_user", JSON.stringify({ name: displayName, email: email }));
                message.style.color = "#9fb7aa";
                message.innerHTML = `Welcome back, ${displayName} ♡ Redirecting...`;
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 900);
            }
        });

        if (createBtn) {
            createBtn.addEventListener("click", function() {
                let email = document.getElementById("email").value.trim() || "cottagedreamer@yaschi.com";
                let displayName = email.split("@")[0];
                displayName = displayName.charAt(0).toUpperCase() + displayName.slice(1);
                localStorage.setItem("yaschi_user", JSON.stringify({ name: displayName, email: email }));
                let message = document.getElementById("message");
                message.style.color = "#9fb7aa";
                message.innerHTML = `Account created for ${displayName}! Welcome to Yaschi ♡`;
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 900);
            });
        }
    </script>

</body>

</html>
