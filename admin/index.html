<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Yaschi Admin</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../style.css">
</head>
<body class="admin-body">

    <!-- Admin Header -->
    <header class="admin-header">
        <div style="display: flex; align-items: center; gap: 20px;">
            <a href="index.html">
                <img src="../Yaschi_logo.png" alt="Yaschi Admin" style="height: 40px;">
            </a>
            <span style="background: #e2ede5; color: #436b53; font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 12px; text-transform: uppercase;">Admin CMS</span>
        </div>

        <ul class="admin-nav-links">
            <li><a href="index.html" class="active"><i class="fa-solid fa-boxes-stacked"></i> Products</a></li>
            <li><a href="add-product.html"><i class="fa-solid fa-plus"></i> Add Product</a></li>
            <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Hero & Supabase Settings</a></li>
            <li><a href="../index.html" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i> View Store</a></li>
            <li><a href="login.html" id="adminLogoutBtn" style="color: #c94a57;"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a></li>
        </ul>
    </header>

    <main class="admin-container">
        <!-- Top Metrics Row -->
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-card-title">Total Products</div>
                <div class="metric-card-value" id="metricProducts">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-card-title">Active Categories</div>
                <div class="metric-card-value" id="metricCategories">8</div>
            </div>
            <div class="metric-card">
                <div class="metric-card-title">Customer Orders</div>
                <div class="metric-card-value" id="metricOrders">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-card-title">Total Revenue</div>
                <div class="metric-card-value" id="metricRevenue">₹0</div>
            </div>
        </div>

        <!-- Product Management Table Card -->
        <div class="admin-table-card">
            <div class="admin-table-toolbar">
                <div style="display: flex; gap: 12px; align-items: center; flex: 1; max-width: 500px;">
                    <input type="text" id="adminSearchInput" class="form-input" placeholder="Search products by title..." style="flex: 1;">
                    <select id="adminCategoryFilter" class="shop-sort-select">
                        <option value="all">All Departments</option>
                        <option value="corsets">Corsets</option>
                        <option value="dresses">Dresses</option>
                        <option value="skirts">Skirts</option>
                        <option value="shrugs">Shrugs</option>
                        <option value="tops">Tops & Tunics</option>
                        <option value="bottoms">Bottoms</option>
                        <option value="accessories">Accessories</option>
                        <option value="makeup">Makeup</option>
                    </select>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="button" id="btnResetCatalog" class="btn-admin" style="border: 1px solid #ddd; background: #fff;" title="Restore original 24 demo products">
                        <i class="fa-solid fa-rotate-left"></i> Reset Defaults
                    </button>
                    <a href="add-product.html" class="btn-admin btn-admin-primary">
                        <i class="fa-solid fa-plus"></i> Add New Product
                    </a>
                </div>
            </div>

            <div style="overflow-x: auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Featured</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminProductsTbody">
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 40px; color: #888;">Loading catalog...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Feedback Toast -->
    <div id="yaschiToast" class="yaschi-toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/products.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/cart.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tbody = document.getElementById('adminProductsTbody');
            const metricProd = document.getElementById('metricProducts');
            const metricOrders = document.getElementById('metricOrders');
            const metricRevenue = document.getElementById('metricRevenue');

            // Check login state
            const isLogged = localStorage.getItem('yaschi_admin_logged_in');
            if (!isLogged) {
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('adminLogoutBtn').addEventListener('click', () => {
                localStorage.removeItem('yaschi_admin_logged_in');
            });

            async function refreshTable() {
                const search = document.getElementById('adminSearchInput').value.trim();
                const category = document.getElementById('adminCategoryFilter').value;

                let products = await window.YaschiAPI.getProducts({
                    search: search,
                    category: category
                });

                // Update metrics
                const allProducts = await window.YaschiAPI.getProducts();
                const orders = await window.YaschiAPI.getOrders();
                const totalRev = orders.reduce((sum, o) => sum + (Number(o.total) || 0), 0);

                if (metricProd) metricProd.textContent = allProducts.length;
                if (metricOrders) metricOrders.textContent = orders.length;
                if (metricRevenue) metricRevenue.textContent = `₹${totalRev}`;

                if (!products || products.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6" style="text-align:center; padding:50px; color:#888;">
                                No products found matching criteria.
                            </td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = products.map(p => {
                    const img = (p.images && p.images[0]) || '../assets_processed/dresses_1.jpg';
                    const imgPath = img.startsWith('http') || img.startsWith('../') ? img : `../${img}`;
                    return `
                        <tr data-id="${p.id}">
                            <td>
                                <div style="display:flex; align-items:center; gap:14px;">
                                    <img src="${imgPath}" alt="${p.name}" class="admin-table-thumb">
                                    <div>
                                        <div style="font-weight:600; color:var(--color-text-dark);">${p.name}</div>
                                        <div style="font-size:0.75rem; color:#888;">ID: ${p.id}</div>
                                    </div>
                                </div>
                            </td>
                            <td><span style="background:#eef4f0; color:#5c7868; padding:3px 9px; border-radius:10px; font-size:0.8rem; text-transform:capitalize;">${p.category}</span></td>
                            <td><strong style="color:var(--color-rose-gold);">₹${p.price}</strong></td>
                            <td>
                                <span style="font-weight:600; color:${p.stock <= 5 ? '#c06232' : '#4a8664'};">
                                    ${p.stock} units
                                </span>
                            </td>
                            <td>
                                <span style="font-size:0.85rem; color:${p.featured ? '#4a8664' : '#aaa'};">
                                    ${p.featured ? '<i class="fa-solid fa-circle-check"></i> Yes' : 'No'}
                                </span>
                            </td>
                            <td>
                                <div style="display:flex; gap:6px;">
                                    <a href="add-product.html?id=${p.id}" class="btn-admin" style="background:#edf3f0; color:var(--color-title-sage);" title="Edit Product">
                                        <i class="fa-solid fa-pen-to-square"></i> Edit
                                    </a>
                                    <button type="button" class="btn-admin btn-duplicate-product" data-id="${p.id}" style="background:#f4ecea; color:#8b5a5e;" title="Duplicate Product">
                                        <i class="fa-regular fa-copy"></i>
                                    </button>
                                    <button type="button" class="btn-admin btn-admin-danger btn-delete-product" data-id="${p.id}" title="Delete Product">
                                        <i class="fa-regular fa-trash-can"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');

                // Bind duplicate buttons
                tbody.querySelectorAll('.btn-duplicate-product').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const id = btn.getAttribute('data-id');
                        const original = await window.YaschiAPI.getProductById(id);
                        if (original) {
                            const copy = {
                                ...original,
                                id: `prod-${Date.now()}`,
                                name: `${original.name} (Copy)`
                            };
                            await window.YaschiAPI.createProduct(copy);
                            refreshTable();
                        }
                    });
                });

                // Bind delete buttons
                tbody.querySelectorAll('.btn-delete-product').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const id = btn.getAttribute('data-id');
                        if (confirm(`Are you sure you want to delete product "${id}"?`)) {
                            await window.YaschiAPI.deleteProduct(id);
                            refreshTable();
                        }
                    });
                });
            }

            // Filters
            document.getElementById('adminSearchInput').addEventListener('input', refreshTable);
            document.getElementById('adminCategoryFilter').addEventListener('change', refreshTable);

            // Reset defaults
            document.getElementById('btnResetCatalog').addEventListener('click', () => {
                if (confirm('Reset catalog to the default 24 cottagecore products? Custom changes will be overwritten.')) {
                    window.YaschiAPI.resetCatalog();
                    refreshTable();
                }
            });

            refreshTable();
        });
    </script>
</body>
</html>
