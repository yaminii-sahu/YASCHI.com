<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add / Edit Product | Yaschi Admin</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../style.css">
</head>
<body class="admin-body">

    <!-- Admin Header -->
    <header class="admin-header">
        <div style="display: flex; align-items: center; gap: 20px;">
            <a href="index.html">
                <img src="../Yaschi_logo.png" alt="Yaschi Admin" style="height: 40px;">
            </a>
            <span style="background: #e2ede5; color: #436b53; font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 12px; text-transform: uppercase;">Admin CMS</span>
        </div>

        <ul class="admin-nav-links">
            <li><a href="index.html"><i class="fa-solid fa-boxes-stacked"></i> Products</a></li>
            <li><a href="add-product.html" class="active"><i class="fa-solid fa-plus"></i> Add Product</a></li>
            <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Hero & Supabase Settings</a></li>
            <li><a href="../index.html" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i> View Store</a></li>
            <li><a href="login.html" id="adminLogoutBtn" style="color: #c94a57;"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a></li>
        </ul>
    </header>

    <main class="admin-container" style="max-width: 900px;">
        <div style="margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;">
            <h1 style="font-family: var(--font-serif-display); color: var(--color-text-dark);" id="pageFormTitle">Add New Product</h1>
            <a href="index.html" style="color: var(--color-title-sage); font-weight: 600; font-size: 0.9rem;">&larr; Back to Products</a>
        </div>

        <div class="checkout-card">
            <form id="productForm">
                <input type="hidden" id="productId">

                <div class="form-group">
                    <label class="form-label" for="prodName">Product Title *</label>
                    <input type="text" id="prodName" class="form-input" placeholder="e.g. Victorian Lavender Lace Corset" required>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="form-label" for="prodCategory">Department / Category *</label>
                        <select id="prodCategory" class="form-input" required>
                            <option value="corsets">Corsets</option>
                            <option value="dresses">Dresses</option>
                            <option value="skirts">Skirts</option>
                            <option value="shrugs">Shrugs</option>
                            <option value="tops">Tops & Tunics</option>
                            <option value="bottoms">Bottoms</option>
                            <option value="accessories">Accessories</option>
                            <option value="makeup">Makeup</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="prodBadge">Badge (Optional)</label>
                        <select id="prodBadge" class="form-input">
                            <option value="">None</option>
                            <option value="Bestseller">Bestseller</option>
                            <option value="Trending">Trending</option>
                            <option value="New">New Arrival</option>
                            <option value="Sale">Sale</option>
                            <option value="Limited">Limited Edition</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="form-label" for="prodPrice">Selling Price (₹) *</label>
                        <input type="number" id="prodPrice" class="form-input" placeholder="1999" required min="1">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="prodOriginalPrice">Original Price (₹)</label>
                        <input type="number" id="prodOriginalPrice" class="form-input" placeholder="2499" min="1">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="form-label" for="prodStock">Stock Inventory Units *</label>
                        <input type="number" id="prodStock" class="form-input" placeholder="15" required min="0" value="10">
                    </div>
                    <div class="form-group" style="justify-content: center;">
                        <label class="form-label" style="margin-bottom: 8px;">Homepage Display</label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem;">
                            <input type="checkbox" id="prodFeatured" style="width: 18px; height: 18px; accent-color: var(--color-title-sage);">
                            <span>Show in "Trending Pieces" on Homepage</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="prodImages">Image Paths or URLs (comma-separated) *</label>
                    <input type="text" id="prodImages" class="form-input" placeholder="e.g. assets_processed/corsets_1.jpg, corset1.jpeg" required>
                    <div style="font-size: 0.78rem; color: #888; margin-top: 4px;">Local paths: <code>assets_processed/corsets_1.jpg</code>, <code>corset1.jpeg</code>, etc., or direct https image URLs.</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Available Sizes</label>
                    <div style="display: flex; gap: 14px; flex-wrap: wrap;" id="sizeCheckboxes">
                        <label><input type="checkbox" value="XS" checked> XS</label>
                        <label><input type="checkbox" value="S" checked> S</label>
                        <label><input type="checkbox" value="M" checked> M</label>
                        <label><input type="checkbox" value="L" checked> L</label>
                        <label><input type="checkbox" value="XL"> XL</label>
                        <label><input type="checkbox" value="One Size"> One Size</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="prodDescription">Product Description</label>
                    <textarea id="prodDescription" class="form-input" rows="4" placeholder="Storybook cottagecore details, materials, and romantic styling suggestions..."></textarea>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="form-label" for="prodFabric">Fabric Details</label>
                        <input type="text" id="prodFabric" class="form-input" placeholder="100% Breathable Cotton / Jacquard">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="prodCare">Care Instructions</label>
                        <input type="text" id="prodCare" class="form-input" placeholder="Hand wash cold or gentle cycle">
                    </div>
                </div>

                <div style="display: flex; gap: 14px; margin-top: 24px;">
                    <button type="submit" class="btn-admin btn-admin-primary" style="padding: 12px 28px; font-size: 0.95rem;">
                        <i class="fa-solid fa-floppy-disk"></i> Save Product
                    </button>
                    <a href="index.html" class="btn-admin" style="background: #eee; color: #555; padding: 12px 20px;">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </main>

    <!-- Feedback Toast -->
    <div id="yaschiToast" class="yaschi-toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/products.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/cart.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const isLogged = localStorage.getItem('yaschi_admin_logged_in');
            if (!isLogged) {
                window.location.href = 'login.html';
                return;
            }

            const logoutBtn = document.getElementById('adminLogoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    localStorage.removeItem('yaschi_admin_logged_in');
                });
            }

            const params = new URLSearchParams(window.location.search);
            const editId = params.get('id');

            if (editId) {
                document.getElementById('pageFormTitle').textContent = 'Edit Product';
                const product = await window.YaschiAPI.getProductById(editId);

                if (product) {
                    document.getElementById('productId').value = product.id;
                    document.getElementById('prodName').value = product.name || '';
                    document.getElementById('prodCategory').value = product.category || 'corsets';
                    document.getElementById('prodBadge').value = product.badge || '';
                    document.getElementById('prodPrice').value = product.price || '';
                    document.getElementById('prodOriginalPrice').value = product.originalPrice || '';
                    document.getElementById('prodStock').value = product.stock || 10;
                    document.getElementById('prodFeatured').checked = Boolean(product.featured);
                    document.getElementById('prodImages').value = (product.images || []).join(', ');
                    document.getElementById('prodDescription').value = product.description || '';
                    document.getElementById('prodFabric').value = (product.details && product.details.fabric) || '';
                    document.getElementById('prodCare').value = (product.details && product.details.care) || '';

                    // Check sizes
                    const existingSizes = new Set(product.sizes || []);
                    document.querySelectorAll('#sizeCheckboxes input').forEach(cb => {
                        cb.checked = existingSizes.has(cb.value);
                    });
                }
            }

            document.getElementById('productForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                const id = document.getElementById('productId').value.trim() || undefined;
                const name = document.getElementById('prodName').value.trim();
                const category = document.getElementById('prodCategory').value;
                const badge = document.getElementById('prodBadge').value;
                const price = Number(document.getElementById('prodPrice').value);
                const originalPrice = Number(document.getElementById('prodOriginalPrice').value) || price;
                const stock = Number(document.getElementById('prodStock').value);
                const featured = document.getElementById('prodFeatured').checked;
                const images = document.getElementById('prodImages').value
                    .split(',')
                    .map(s => s.trim())
                    .filter(Boolean);
                const description = document.getElementById('prodDescription').value.trim();
                const fabric = document.getElementById('prodFabric').value.trim();
                const care = document.getElementById('prodCare').value.trim();

                const selectedSizes = [];
                document.querySelectorAll('#sizeCheckboxes input:checked').forEach(cb => {
                    selectedSizes.push(cb.value);
                });

                const productData = {
                    id: id,
                    name: name,
                    category: category,
                    badge: badge,
                    price: price,
                    originalPrice: originalPrice,
                    stock: stock,
                    featured: featured,
                    images: images.length > 0 ? images : ['assets_processed/dresses_1.jpg'],
                    sizes: selectedSizes.length > 0 ? selectedSizes : ['One Size'],
                    description: description,
                    details: {
                        fabric: fabric,
                        care: care
                    }
                };

                await window.YaschiAPI.saveProduct(productData);

                if (window.YaschiCart && window.YaschiCart.showToast) {
                    window.YaschiCart.showToast('Product saved successfully!');
                }

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);
            });
        });
    </script>
</body>
</html>
