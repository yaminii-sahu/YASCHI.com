<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart | Yaschi</title>

    <style>
        body {
            margin: 0;
            background: #e2e8e4;
            font-family: Arial, sans-serif;
            color: #555;
        }

        h1 {
            text-align: center;
            color: #cfa7b5;
            margin: 35px;
        }

        .cart-container {
            width: 85%;
            margin: auto;
        }

        .cart-item {
            background: #fffaf8;
            margin: 20px 0;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            box-shadow: 0 3px 10px #ccc;
        }

        .cart-item img {
            width: 120px;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
        }

        .item-details {
            margin-left: 25px;
        }

        .price {
            color: #cfa7b5;
            font-size: 20px;
            font-weight: bold;
        }

        .remove {
            background: #d8b4b6;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
        }

        .total {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
            color: #9fb7aa;
            margin: 30px;
        }

        .checkout {
            
            display: block;
            margin: 20px auto;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            background: #9fb7aa;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .empty {
            text-align: center;
            margin: 80px;
        }
    </style>
</head>

<body>

    <h1>♡ My Cart ♡</h1>

    <div class="cart-container" id="cart-container">
    </div>

    <div class="total" id="total">
        Total: ₹0
    </div>

    <a href="checkout.html" style="text-decoration: none;">
        <button class="checkout" onclick="checkout()">
            Proceed to Checkout
        </button>
    </a>

    <script>

        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        let container = document.getElementById("cart-container");

        let total = 0;

        if (cart.length == 0) {

            container.innerHTML =
                '<div class="empty">' +
                '<h2>Your cart is empty ♡</h2>' +
                '<p>Add something from YASCHI!</p>' +
                '</div>';

        }

        for (let i = 0; i < cart.length; i++) {

            total = total + cart[i].price * cart[i].quantity;

            container.innerHTML +=

                '<div class="cart-item">' +

                '<div class="item-details">' +

                '<h2>' + cart[i].name + '</h2>' +

                '<p class="price">₹' + cart[i].price + '</p>' +

                '<p>Quantity: ' + cart[i].quantity + '</p>' +

                '<button class="remove" onclick="removeItem(' + i + ')">' +
                'Remove' +
                '</button>' +

                '</div>' +

                '</div>';

        }

        document.getElementById("total").innerHTML =
            "Total: ₹" + total;


        function removeItem(index) {

            cart.splice(index, 1);

            localStorage.setItem("cart", JSON.stringify(cart));

            location.reload();

        }


        function checkout() {

            if (cart.length == 0) {

                alert("Your cart is empty!");

            } else {

                alert("Proceeding to checkout...");

            }

        }

    </script>

</body>

</html>
